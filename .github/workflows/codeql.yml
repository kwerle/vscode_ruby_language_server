name: CodeQL

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  schedule:
    # Weekly, so new CodeQL queries run even when the code doesn't change.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Only our own code: dist/ and node_modules are built or third-party.
          config: |
            paths:
              - src
              - scripts
              - test

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
